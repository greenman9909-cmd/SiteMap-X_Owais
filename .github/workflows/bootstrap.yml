name: Publish SiteMap-X source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify tested source
        run: |
          cat .bootstrap/part-* | base64 -d > /tmp/source.tar.gz
          echo "8df1fc446b039f42755c2e3b4c8a32987900990ceaa33efc4c242d1f38e71ffb  /tmp/source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/source.tar.gz >/dev/null
      - name: Publish source tree
        run: |
          tar -xzf /tmp/source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete SiteMap-X implementation"
          git push origin main
