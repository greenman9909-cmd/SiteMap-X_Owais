[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemapx"
version = "0.1.0"
description = "Advanced website scraper, offline mirror, endpoint mapper and stack fingerprinting toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Owais"}]
dependencies = [
  "aiohttp>=3.10",
  "httpx[http2]>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tldextract>=5.1",
  "playwright>=1.47",
  "PySide6>=6.7",
  "aiosqlite>=0.20",
  "click>=8.1",
  "orjson>=3.10",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
sitemapx = "sitemapx.cli:main"
sitemapx-gui = "sitemapx.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sitemapx*"]

[tool.setuptools.package-data]
sitemapx = ["gui/styles/*.qss"]
